<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <!-- Загальні мета-теги -->
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta name="author" content="Delivery Service" />
    <meta
      name="description"
      content="Служба доставки у Дрогобичі та районі. Доставка їжі, квітів, ліків, подарунків та автозапчастин швидко та зручно."
    />
    <meta
      name="keywords"
      content="доставка, їжа, Дрогобич, продукти, ліки, квіти, подарунки, автозапчастини, кур'єр, служба доставки"
    />

    <!-- Open Graph для соцмереж -->
    <meta
      property="og:title"
      content="Служба доставки у Дрогобичі | Delivery Service"
    />
    <meta
      property="og:description"
      content="Швидка та надійна доставка у Дрогобичі та районі. Замовляйте онлайн — зручно та безпечно."
    />
    <meta
      property="og:image"
      content="https://delivery-service.in.ua/icons/Icon-192.png"
    />
    <meta property="og:url" content="https://delivery-service.in.ua/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- iOS meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Delivery Service" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Служба доставки у Дрогобичі | Delivery Service</title>
    <link rel="manifest" href="manifest.json" />

    <script>
      var serviceWorkerVersion = null;
    </script>
    <script src="flutter.js" defer></script>
  </head>

  <body>
    <script>
      window.addEventListener("load", function (ev) {
        _flutter.loader.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </body>
</html>
